version: 2

project_name: almagest

before:
  hooks:
    - go -C bin run ./cmd/package-locales ../locales ../build/packaging/locales

builds:
  - id: almagestd-amd64
    dir: bin
    main: ./almagestd
    binary: libexec/almagest/almagestd
    env: &go_env
      - CGO_ENABLED=0
    flags: &go_flags
      - -trimpath
    goos: &linux_only
      - linux
    goarch: &amd64_only
      - amd64
    goamd64: &amd64_v1
      - v1

  - id: almagest-cli-amd64
    dir: bin
    main: ./almagest-cli
    binary: bin/almagest-cli
    env: *go_env
    flags: *go_flags
    goos: *linux_only
    goarch: *amd64_only
    goamd64: *amd64_v1

  - id: almagest-network-role
    dir: bin
    main: ./cmd/almagest-network-role
    binary: libexec/almagest/almagest-network-role
    env: *go_env
    flags: *go_flags
    goos: *linux_only
    goarch: *amd64_only
    goamd64: *amd64_v1

  - id: almagestd-arm64
    dir: bin
    main: ./almagestd
    binary: libexec/almagest/almagestd
    env: *go_env
    flags: *go_flags
    goos: *linux_only
    goarch: &arm64_only
      - arm64

  - id: almagest-cli-arm64
    dir: bin
    main: ./almagest-cli
    binary: bin/almagest-cli
    env: *go_env
    flags: *go_flags
    goos: *linux_only
    goarch: *arm64_only

  - id: almagest-config-writer-role
    dir: bin
    main: ./cmd/almagest-config-writer-role
    binary: libexec/almagest/almagest-config-writer-role
    env: *go_env
    flags: *go_flags
    goos: *linux_only
    goarch: *amd64_only
    goamd64: *amd64_v1

  - id: almagest-command-role
    dir: bin
    main: ./cmd/almagest-command-role
    binary: libexec/almagest/almagest-command-role
    env: *go_env
    flags: *go_flags
    goos: *linux_only
    goarch: *amd64_only
    goamd64: *amd64_v1

  - id: almagest-isolation-storage
    dir: bin
    main: ./cmd/almagest-isolation-storage
    binary: libexec/almagest/almagest-isolation-storage
    env: *go_env
    flags: *go_flags
    goos: *linux_only
    goarch: *amd64_only
    goamd64: *amd64_v1

  # GoReleaser OSS cannot import an existing binary as a typed build artifact.
  # Build a target marker, then replace it with the portable app binary. This
  # keeps the package architecture tied to linux/amd64 instead of "all".
  - id: almagest-app-amd64
    dir: bin
    main: ./almagest-cli
    binary: almagest-app
    env: *go_env
    flags: *go_flags
    goos: *linux_only
    goarch: *amd64_only
    goamd64: *amd64_v1
    hooks:
      post:
        - cmd: cp build/packaging/almagest-app "{{ .Path }}"
          dir: .

archives:
  - id: linux-amd64
    ids:
      - almagestd-amd64
      - almagest-cli-amd64
      - almagest-network-role
      - almagest-config-writer-role
      - almagest-command-role
      - almagest-isolation-storage
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_amd64"
    files:
      - src: build/packaging/almagest-linux-role-launcher
        dst: libexec/almagest/almagest-linux-role-launcher
        info:
          mode: 0755
      - src: build/packaging/almagest-subprogram-launcher
        dst: libexec/almagest/almagest-subprogram-launcher
        info:
          mode: 0755
      - src: packaging/linux/alm.hujson
        dst: etc/almagest/alm.hujson
        info:
          mode: 0600
      - src: packaging/linux/protected_alm.hujson
        dst: etc/almagest/protected_alm.hujson
        info:
          mode: 0600
      - src: packaging/linux/almagestd.service
        dst: lib/systemd/system/almagestd.service
      - src: packaging/linux/almagest.sysusers
        dst: lib/sysusers.d/almagest.conf
      - src: packaging/linux/almagest.tmpfiles
        dst: lib/tmpfiles.d/almagest.conf
      - src: build/packaging/locales
        dst: share/almagest/locales
      - src: examples/**/*
        dst: share/almagest/examples
      - src: README.md
        dst: share/doc/almagest/README.md
      - src: LICENSE
        dst: share/doc/almagest/LICENSE
      - src: packaging/linux/README.md
        dst: PACKAGE_CONTENTS.md

  - id: linux-arm64
    ids:
      - almagestd-arm64
      - almagest-cli-arm64
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_arm64"
    files:
      - src: packaging/linux/alm.hujson
        dst: etc/almagest/alm.hujson
        info:
          mode: 0600
      - src: packaging/linux/protected_alm.hujson
        dst: etc/almagest/protected_alm.hujson
        info:
          mode: 0600
      - src: packaging/linux/almagestd.service
        dst: lib/systemd/system/almagestd.service
      - src: packaging/linux/almagest.sysusers
        dst: lib/sysusers.d/almagest.conf
      - src: packaging/linux/almagest.tmpfiles
        dst: lib/tmpfiles.d/almagest.conf
      - src: build/packaging/locales
        dst: share/almagest/locales
      - src: examples/**/*
        dst: share/almagest/examples
      - src: README.md
        dst: share/doc/almagest/README.md
      - src: LICENSE
        dst: share/doc/almagest/LICENSE
      - src: packaging/linux/README.md
        dst: PACKAGE_CONTENTS.md

  - id: app-linux-amd64
    ids:
      - almagest-app-amd64
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-app_{{ .Version }}_linux_amd64"
    files:
      - src: packaging/linux/almagest-app.desktop
        dst: share/applications/almagest-app.desktop
      - src: packaging/linux/almagest-app-autostart.desktop
        dst: etc/xdg/autostart/almagest-app.desktop
      - src: app/src-tauri/icons/128x128.png
        dst: share/icons/hicolor/128x128/apps/almagest.png
      - src: LICENSE
        dst: share/licenses/almagest-app/LICENSE
      - src: packaging/linux/app-README.md
        dst: PACKAGE_CONTENTS.md

nfpms:
  - id: linux-packages
    package_name: almagest
    ids:
      - almagestd-amd64
      - almagest-cli-amd64
      - almagest-network-role
      - almagest-config-writer-role
      - almagest-command-role
      - almagest-isolation-storage
    vendor: Almagest contributors
    homepage: https://github.com/asciimoth/almagest
    maintainer: AsciiMoth <ascii@moth.contact>
    description: Userspace network graph daemon and administration client.
    license: GPL-3.0-or-later
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr
    section: net
    priority: optional
    contents:
      - src: build/packaging/almagest-linux-role-launcher
        dst: /usr/libexec/almagest/almagest-linux-role-launcher
        file_info: &executable_info
          mode: 0755
          owner: root
          group: root
      - src: build/packaging/almagest-subprogram-launcher
        dst: /usr/libexec/almagest/almagest-subprogram-launcher
        file_info: *executable_info
      - src: packaging/linux/alm.hujson
        dst: /etc/almagest/alm.hujson
        type: config|noreplace
        file_info: &config_info
          mode: 0600
          owner: root
          group: root
      - src: packaging/linux/protected_alm.hujson
        dst: /etc/almagest/protected_alm.hujson
        type: config|noreplace
        file_info: *config_info
      - src: packaging/linux/almagestd.service
        dst: /usr/lib/systemd/system/almagestd.service
      - src: packaging/linux/almagest.sysusers
        dst: /usr/lib/sysusers.d/almagest.conf
      - src: packaging/linux/almagest.tmpfiles
        dst: /usr/lib/tmpfiles.d/almagest.conf
      - src: build/packaging/locales/
        dst: /usr/share/almagest/locales
        type: tree
      - src: examples/
        dst: /usr/share/almagest/examples
        type: tree
      - src: README.md
        dst: /usr/share/doc/almagest/README.md
      - src: LICENSE
        dst: /usr/share/licenses/almagest/LICENSE
    scripts:
      postinstall: packaging/linux/postinstall.sh
      postremove: packaging/linux/postremove.sh

  - id: linux-arm64-packages
    package_name: almagest
    ids:
      - almagestd-arm64
      - almagest-cli-arm64
    vendor: Almagest contributors
    homepage: https://github.com/asciimoth/almagest
    maintainer: AsciiMoth <ascii@moth.contact>
    description: Userspace network graph daemon and administration client.
    license: GPL-3.0-or-later
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr
    section: net
    priority: optional
    contents:
      - src: packaging/linux/alm.hujson
        dst: /etc/almagest/alm.hujson
        type: config|noreplace
        file_info: *config_info
      - src: packaging/linux/protected_alm.hujson
        dst: /etc/almagest/protected_alm.hujson
        type: config|noreplace
        file_info: *config_info
      - src: packaging/linux/almagestd.service
        dst: /usr/lib/systemd/system/almagestd.service
      - src: packaging/linux/almagest.sysusers
        dst: /usr/lib/sysusers.d/almagest.conf
      - src: packaging/linux/almagest.tmpfiles
        dst: /usr/lib/tmpfiles.d/almagest.conf
      - src: build/packaging/locales/
        dst: /usr/share/almagest/locales
        type: tree
      - src: examples/
        dst: /usr/share/almagest/examples
        type: tree
      - src: README.md
        dst: /usr/share/doc/almagest/README.md
      - src: LICENSE
        dst: /usr/share/licenses/almagest/LICENSE
    scripts:
      postinstall: packaging/linux/postinstall.sh
      postremove: packaging/linux/postremove.sh

  - id: linux-app-packages
    package_name: almagest-app
    file_name_template: "{{ .PackageName }}_{{ .Version }}_linux_amd64"
    ids:
      - almagest-app-amd64
    vendor: Almagest contributors
    homepage: https://github.com/asciimoth/almagest
    maintainer: AsciiMoth <ascii@moth.contact>
    description: Desktop client for the Almagest administration API.
    license: GPL-3.0-or-later
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin
    section: net
    priority: optional
    contents:
      - src: packaging/linux/almagest-app.desktop
        dst: /usr/share/applications/almagest-app.desktop
      - src: packaging/linux/almagest-app-autostart.desktop
        dst: /etc/xdg/autostart/almagest-app.desktop
      - src: app/src-tauri/icons/128x128.png
        dst: /usr/share/icons/hicolor/128x128/apps/almagest.png
      - src: packaging/linux/app-README.md
        dst: /usr/share/doc/almagest-app/README.md
      - src: LICENSE
        dst: /usr/share/licenses/almagest-app/LICENSE
    overrides:
      deb:
        dependencies:
          - libgtk-3-0
          - libwebkit2gtk-4.1-0
      rpm:
        dependencies:
          - gtk3
          - webkit2gtk4.1
      archlinux:
        dependencies:
          - gtk3
          - webkit2gtk-4.1
checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

release:
  disable: true
