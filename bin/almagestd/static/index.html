<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Almagest Admin</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }

      main {
        width: min(34rem, calc(100vw - 3rem));
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: color-mix(in srgb, CanvasText 72%, transparent);
        line-height: 1.5;
      }

      code {
        font: inherit;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Almagest Admin</h1>
      <p>Static web admin placeholder. JSON WebSocket API endpoint: <code>/api/ws</code>.</p>
    </main>
  </body>
</html>
