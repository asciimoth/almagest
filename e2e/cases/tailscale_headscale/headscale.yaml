server_url: https://headscale.e2e.internal:18090
listen_addr: 127.0.0.1:18090
metrics_listen_addr: ""
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: true
trusted_proxies: []

noise:
  private_key_path: %E2E_RUNTIME%/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: true
    region_id: 999
    region_code: local
    region_name: Local test DERP
    verify_clients: true
    stun_listen_addr: 127.0.0.1:13478
    private_key_path: %E2E_RUNTIME%/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
  urls: []
  paths: []
  auto_update_enabled: false
  update_frequency: 3h

disable_check_updates: true

node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m
  routes:
    ha:
      probe_interval: 0s
      probe_timeout: 1s

database:
  type: sqlite
  debug: false
  sqlite:
    path: %E2E_RUNTIME%/headscale/db.sqlite
    write_ahead_log: true

tls_cert_path: %E2E_RUNTIME%/headscale/tls.crt
tls_key_path: %E2E_RUNTIME%/headscale/tls.key

log:
  level: info
  format: text

policy:
  mode: file
  path: %E2E_CONFIG_DIR%/policy.hujson

dns:
  magic_dns: true
  base_domain: e2e.internal
  override_local_dns: false
  nameservers:
    global: []
    split: {}
  search_domains: []
  extra_records:
    - name: v4.magic.e2e.internal
      type: A
      value: 192.0.2.10
    - name: v4-alt.magic.e2e.internal
      type: A
      value: 192.0.2.10
    - name: v6.magic.e2e.internal
      type: AAAA
      value: 2001:db8::10
    - name: v6-alt.magic.e2e.internal
      type: AAAA
      value: 2001:db8::10
    - name: alias.magic.e2e.internal
      type: CNAME
      value: v4.magic.e2e.internal
    - name: zone.magic.e2e.internal
      type: NS
      value: ns1.magic.e2e.internal
    - name: mail.magic.e2e.internal
      type: MX
      value: 10 mx1.magic.e2e.internal
    - name: _service._tcp.magic.e2e.internal
      type: SRV
      value: 10 20 8443 target.magic.e2e.internal
    - name: text.magic.e2e.internal
      type: TXT
      value: tailscale magic text

unix_socket: %E2E_RUNTIME%/headscale/headscale.sock
unix_socket_permission: "0777"
logtail:
  enabled: false
taildrop:
  enabled: false
