[package]
name = "almagest-app"
version = "0.1.0"
description = "Desktop client for the Almagest administration API"
authors = ["Almagest contributors"]
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
publish = false

[build-dependencies]
ico = "0.6.0"
resvg = { version = "0.45.1", default-features = false }
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.12.5", default-features = false, features = [
  "common-controls-v6",
  "compression",
  "dbus",
  "tray-icon",
  "wry",
  "x11",
] }
tauri-plugin-opener = "2.7.2"
tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }
url = "2.5.8"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
tauri-plugin-single-instance = "2.5.4"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
# Tauri enables AppIndicator, which panics at runtime when its optional shared
# library is absent. Enabling KSNI makes tray-icon use its D-Bus backend.
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
almagest-windows-pipe = { path = "windows-pipe" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
