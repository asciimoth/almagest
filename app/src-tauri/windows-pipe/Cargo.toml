[package]
name = "almagest-windows-pipe"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[lints.rust]
# Unsafe code is limited to the reviewed Windows API boundary in this crate.
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
