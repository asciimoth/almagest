name: checks

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: |
            bin/go.sum
            lib/go.sum
      - run: pipx install ruff==0.16.4
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $modulePath = (Get-Module -ListAvailable PSScriptAnalyzer |
            Where-Object Version -EQ 1.25.0).Path
          "PSSCRIPTANALYZER_PATH=$modulePath" >> $env:GITHUB_ENV
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - run: just lint

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: |
            bin/go.sum
            lib/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: just test-go

  windows-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: |
            bin/go.sum
            lib/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: just build-windows
