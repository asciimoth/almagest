name: checks

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache-dependency-path: |
            bin/go.sum
            lib/go.sum
            certcat/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: python -m pip install mdformat==1.0.0 mdformat-gfm==1.0.0 mdformat-gfm-alerts==2.0.0 ruff==0.16.4
      - run: npm install --global markdownlint-cli@0.49.1
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $modulePath = (Get-Module -ListAvailable PSScriptAnalyzer |
            Where-Object Version -EQ 1.25.0).Path
          "PSSCRIPTANALYZER_PATH=$modulePath" >> $env:GITHUB_ENV
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - run: cargo install ripsecrets --version 0.1.11 --locked
      - name: Verify lint tools
        run: |
          for tool in bash cargo git go golangci-lint just markdownlint mdformat node npm pwsh python ruff ripsecrets shellcheck; do
            command -v "$tool"
          done
      - run: just lint

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache-dependency-path: |
            bin/go.sum
            lib/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: just test-go

  windows-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache-dependency-path: |
            bin/go.sum
            lib/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: just build-windows

  webdemo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache-dependency-path: |
            bin/go.sum
            lib/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: just build-webdemo
      - run: node --test tests/admin_transport.test.mjs tests/webdemo_publish.test.mjs
        working-directory: panel
      - uses: actions/upload-artifact@v4
        with:
          name: webdemo
          path: build/webdemo
          if-no-files-found: error
