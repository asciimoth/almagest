name: checks

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache-dependency-path: |
            bin/go.sum
            lib/go.sum
            certcat/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: python -m pip install mdformat==1.0.0 mdformat-gfm==1.0.0 mdformat-gfm-alerts==2.0.0 ruff==0.16.4
      - run: npm install --global markdownlint-cli@0.49.1
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $modulePath = (Get-Module -ListAvailable PSScriptAnalyzer |
            Where-Object Version -EQ 1.25.0).Path
          "PSSCRIPTANALYZER_PATH=$modulePath" >> $env:GITHUB_ENV
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          install-only: true
          skip-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-v2.13.1-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            golangci-${{ runner.os }}-v2.13.1-${{ hashFiles('**/go.sum') }}-
      - name: Install ripsecrets
        run: |
          curl -fsSL --retry 3 \
            https://github.com/sirwart/ripsecrets/releases/download/v0.1.11/ripsecrets-0.1.11-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/ripsecrets.tar.gz"
          echo '9daf017dfdea242a58f672450a2526f0406211afe9e872c740adc49b42feccf5  '"$RUNNER_TEMP/ripsecrets.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ci-bin"
          tar -xzf "$RUNNER_TEMP/ripsecrets.tar.gz" -C "$RUNNER_TEMP/ci-bin" \
            --strip-components=1 ripsecrets-0.1.11-x86_64-unknown-linux-gnu/ripsecrets
          echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
      - name: Verify lint tools
        run: |
          for tool in bash git go golangci-lint just markdownlint mdformat node npm pwsh python ruff ripsecrets shellcheck; do
            command -v "$tool"
          done
      - run: just lint-core
      - name: Core Go tests
        run: |
          go -C certcat test ./...
          go -C lib test . ./dns ./http ./network ./socks
          go -C bin test ./almagestd ./almagestd/command ./api
      - run: just build-webdemo
      - run: node --test tests/admin_transport.test.mjs tests/webdemo_publish.test.mjs
        working-directory: panel
      - uses: actions/upload-artifact@v4
        with:
          name: webdemo
          path: build/webdemo
          if-no-files-found: error

  app-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - run: just app-lint

  deploy-pages:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [check, app-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webdemo
          path: build/webdemo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/webdemo
      - id: deployment
        uses: actions/deploy-pages@v4
