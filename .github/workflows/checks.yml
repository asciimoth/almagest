name: checks

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run_native_windows:
        description: Run configured native Windows runners
        required: false
        default: false
        type: boolean

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - run: just lint

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: just test-total

  windows-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: just build-windows

  windows-standard:
    if: github.event_name == 'workflow_dispatch' && inputs.run_native_windows
    runs-on: [self-hosted, windows-server-2022, x64, standard-user]
    steps:
      - uses: actions/checkout@v4
      - run: just test-windows-vm

  windows-privileged:
    if: github.event_name == 'workflow_dispatch' && inputs.run_native_windows
    runs-on: [self-hosted, windows-server-2022, x64, elevated]
    steps:
      - uses: actions/checkout@v4
      - run: just test-windows-e2e
